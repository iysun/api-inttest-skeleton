# 通用示例场景：演示 vars / ${state.*} / save / assert / steps 链式引用。
# 跑法：pnpm start run --env stable scenarios/stable/example.yaml
# ★ 接入你的项目后按需替换/删除。
name: 示例：创建资源并查询详情

vars:
  bizNo: "IT-RES-EX-001"

steps:
  # 1) 新建一个资源，把返回的 id 存到顶层变量 newId
  - id: create
    api: resource.create
    body:
      bizNo: "${bizNo}"
      name: "示例资源"
      type: "DEMO"
      # 需要引用铺底产物时：resourceRef: "${state.seedResourceId}"
    save:
      newId: "data.resourceId"
    assert:
      - "code == 200"
      - "data.resourceId != null"

  # 2) GET 查询详情，query 参数引用上一步 save 的 newId（也可用 ${steps.create.data.resourceId}）
  - id: detail
    api: resource.get
    params:
      resourceId: "${newId}"
    assert:
      - "code == 200"
