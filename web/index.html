<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>接口集测 · 场景运行控制台</title>
<link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css" />
<link rel="stylesheet" id="hljs-theme" href="vendor/highlightjs/catppuccin-latte.min.css" />
<script>
/**
 * 主题应用：算 dark → 设 data-bs-theme → 切 #hljs-theme href。
 * 挂在 window 上，供下面的预初始化 IIFE 和后面 module 里的 Vue app 共用一份实现，避免两处重复。
 */
function applyThemeDom(pref) {
  var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
  var l = document.getElementById('hljs-theme');
  if (l) l.setAttribute('href', 'vendor/highlightjs/' + (dark ? 'catppuccin-mocha' : 'catppuccin-latte') + '.min.css');
}
// 主题初始化（在首帧前设定，避免闪烁）：读取偏好 auto/light/dark
(function () {
  try {
    applyThemeDom(localStorage.getItem('tyit-theme') || 'auto');
  } catch (e) { /* localStorage 不可用时退回默认（浅色） */ }
})();
</script>
<style>
  :root { --bs-body-font-family: "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", sans-serif; }

  /* 深色主题：Catppuccin Mocha 调色板 */
  [data-bs-theme="dark"] {
    --bs-body-bg: #1e1e2e; --bs-body-color: #cdd6f4;
    --bs-tertiary-bg: #181825; --bs-secondary-bg: #313244;
    --bs-border-color: #313244; --bs-secondary-color: #7f849c; --bs-emphasis-color: #b4befe;
    --bs-card-bg: #181825; --bs-card-border-color: #313244; --bs-card-cap-bg: #313244;
    /* Catppuccin 语义色（badge/alert/文本 通行/失败） */
    --bs-primary: #89b4fa; --bs-primary-rgb: 137,180,250;
    --bs-success: #a6e3a1; --bs-success-rgb: 166,227,161;
    --bs-danger: #f38ba8; --bs-danger-rgb: 243,139,168;
    --bs-success-text-emphasis: #a6e3a1; --bs-success-bg-subtle: #26332a; --bs-success-border-subtle: #3b4d3c;
    --bs-danger-text-emphasis: #f38ba8; --bs-danger-bg-subtle: #3a2730; --bs-danger-border-subtle: #553a45;
    --ctp-on-accent: #1e1e2e;
    --ctp-titlebar-bg: #11111b; --ctp-titlebar-border: #11111b;
    --ctp-sidebar-bg: #181825; --ctp-sidebar-border: #313244;
    --ctp-list-hover-bg: #313244; --ctp-list-hover-color: #cdd6f4;
    --ctp-list-active-bg: #45475a; --ctp-list-active-color: #cdd6f4;
    --ctp-accent: #89b4fa; --ctp-accent-hover: #74a0f0;
    --ctp-editor-bg: #1e1e2e;
    --ctp-scrollbar-thumb: #45475a; --ctp-scrollbar-thumb-hover: #585b70;
  }
  /* 浅色主题：Catppuccin Latte 调色板 */
  [data-bs-theme="light"] {
    --bs-body-bg: #eff1f5; --bs-body-color: #4c4f69;
    --bs-tertiary-bg: #e6e9ef; --bs-secondary-bg: #ccd0da;
    --bs-border-color: #ccd0da; --bs-secondary-color: #8c8fa1; --bs-emphasis-color: #7287fd;
    --bs-card-bg: #e6e9ef; --bs-card-border-color: #ccd0da; --bs-card-cap-bg: #ccd0da;
    --bs-primary: #1e66f5; --bs-primary-rgb: 30,102,245;
    --bs-success: #40a02b; --bs-success-rgb: 64,160,43;
    --bs-danger: #d20f39; --bs-danger-rgb: 210,15,57;
    --bs-success-text-emphasis: #40a02b; --bs-success-bg-subtle: #e5f0e1; --bs-success-border-subtle: #c6e0bd;
    --bs-danger-text-emphasis: #d20f39; --bs-danger-bg-subtle: #f7dbe1; --bs-danger-border-subtle: #eebac5;
    --ctp-on-accent: #eff1f5;
    --ctp-titlebar-bg: #dce0e8; --ctp-titlebar-border: #dce0e8;
    --ctp-sidebar-bg: #e6e9ef; --ctp-sidebar-border: #ccd0da;
    --ctp-list-hover-bg: #ccd0da; --ctp-list-hover-color: #4c4f69;
    --ctp-list-active-bg: #bcc0cc; --ctp-list-active-color: #4c4f69;
    --ctp-accent: #1e66f5; --ctp-accent-hover: #0b56ee;
    --ctp-editor-bg: #eff1f5;
    --ctp-scrollbar-thumb: #bcc0cc; --ctp-scrollbar-thumb-hover: #acb0be;
  }

  /* ===== 基础布局 ===== */
  html, body { height: 100%; }
  body { overflow: hidden; }
  .app { display: flex; height: calc(100vh - 3.5rem); }
  .sidebar { width: 330px; flex-shrink: 0; overflow: auto; border-right: 1px solid var(--ctp-sidebar-border); background: var(--ctp-sidebar-bg); }
  /* 主区：固定 Tab 条 + 可滚动主体（多 Tab 时 Tab 条不随内容滚动） */
  #out { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .tab-body { flex: 1; overflow: auto; padding: 1.25rem; }

  /* ===== Tab 条 ===== */
  /* 已打开场景横排；active 用编辑器底色 + 底部 accent 条区分；多 Tab 溢出横向滚动（滚动条已主题化） */
  .tab-strip {
    display: flex; flex-shrink: 0; overflow-x: auto; overflow-y: hidden;
    background: var(--ctp-titlebar-bg); border-bottom: 1px solid var(--ctp-sidebar-border);
  }
  .tab-item {
    display: flex; align-items: center; gap: .4rem; flex: 0 0 auto; max-width: 220px;
    padding: .4rem .5rem .4rem .75rem; font-size: .8rem; color: var(--bs-secondary-color); cursor: pointer;
    border-right: 1px solid var(--ctp-sidebar-border); border-bottom: 2px solid transparent; user-select: none;
  }
  .tab-item:hover { background: var(--ctp-list-hover-bg); color: var(--ctp-list-hover-color); }
  .tab-item.active { color: var(--bs-body-color); background: var(--ctp-editor-bg); border-bottom-color: var(--ctp-accent); }
  .tab-item .tab-label { min-width: 0; }
  .tab-item .tab-elapsed { font-variant-numeric: tabular-nums; font-size: .72rem; color: var(--bs-secondary-color); }
  .tab-item .tab-close {
    border: 0; background: transparent; line-height: 1; padding: 0 .15rem; font-size: 1rem;
    color: var(--bs-secondary-color); border-radius: 3px; cursor: pointer;
  }
  .tab-item .tab-close:hover { color: var(--bs-danger); background: var(--ctp-list-active-bg); }

  /* ===== 侧栏：项目分组 ===== */
  /* 项目分组：每个目录一段，段间加分隔线 + 段内首缩进，凸显不同项目的边界 */
  .sidebar .proj-group + .proj-group { border-top: 1px solid var(--ctp-sidebar-border); }
  .sidebar .proj-group { padding-bottom: .35rem; }
  /* 分组标题：吸顶、独立底色的小节条 + 左侧 accent 竖条，滚动时始终标明「当前在哪个项目」；
     两行布局：项目名（大写）/ baseUrl（原样），右侧凭据⚠ + 场景数 */
  .sidebar .dir {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: .4rem;
    width: 100%; text-align: left; cursor: pointer;
    color: var(--bs-secondary-color) !important;
    background: var(--ctp-titlebar-bg);
    border: 0; border-bottom: 1px solid var(--ctp-sidebar-border);
    box-shadow: inset 3px 0 0 var(--ctp-accent);
  }
  .sidebar .dir:hover { color: var(--bs-body-color) !important; }
  .sidebar .dir.dir-active { box-shadow: inset 3px 0 0 var(--ctp-accent), inset 0 0 0 100vmax rgba(137,180,250,.06); }
  .sidebar .dir .caret { font-size: .8rem; }
  .sidebar .dir[aria-expanded="false"] .caret { transform: rotate(-90deg); }
  .sidebar .dir .dir-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .05rem; }
  .sidebar .dir .dir-title {
    display: flex; align-items: center; gap: .35rem;
    font-size: .72rem; letter-spacing: .06em; font-weight: 600; color: var(--bs-body-color);
  }
  .sidebar .dir .dir-base {
    font-size: .66rem; font-weight: 400; letter-spacing: 0; text-transform: none;
    color: var(--bs-secondary-color); opacity: .85;
  }
  .sidebar .dir .dir-flag {
    flex-shrink: 0; font-size: .6rem; font-weight: 600; letter-spacing: 0;
    color: var(--ctp-accent); border: 1px solid var(--ctp-accent); border-radius: .2rem; padding: 0 .25rem;
  }
  .sidebar .dir .dir-warn { flex-shrink: 0; color: var(--bs-danger); font-size: .82rem; }
  .sidebar .dir .proj-count {
    flex-shrink: 0; font-weight: 400; letter-spacing: 0;
    color: var(--bs-secondary-color); opacity: .7;
  }

  /* ===== 顶栏 ===== */
  .navbar { background: var(--ctp-titlebar-bg) !important; border-bottom-color: var(--ctp-titlebar-border) !important; }
  .navbar-brand { color: var(--bs-body-color); }

  /* 场景列表：侧栏项 —— 透明底、hover 微亮、选中态 + 左侧强调条 */
  .sidebar .list-group-item { background: transparent; color: var(--bs-body-color); border: 0; border-radius: 0; }
  .sidebar .list-group-item:hover { background: var(--ctp-list-hover-bg); color: var(--ctp-list-hover-color); }
  .sidebar .list-group-item.active {
    background: var(--ctp-list-active-bg); color: var(--ctp-list-active-color); box-shadow: inset 2px 0 0 var(--ctp-accent);
  }
  /* 已打开但非激活的场景：左侧弱竖条，提示「有 Tab 开着」 */
  .sidebar .list-group-item.tab-open:not(.active) { box-shadow: inset 2px 0 0 var(--ctp-scrollbar-thumb); }

  /* ===== 按钮 ===== */
  /* 运行按钮：Catppuccin 主按钮（accent 底 + 对比前景） */
  .btn-primary { --bs-btn-bg: var(--ctp-accent); --bs-btn-border-color: var(--ctp-accent);
    --bs-btn-hover-bg: var(--ctp-accent-hover); --bs-btn-hover-border-color: var(--ctp-accent-hover);
    --bs-btn-active-bg: var(--ctp-accent-hover); --bs-btn-active-border-color: var(--ctp-accent-hover);
    --bs-btn-disabled-bg: var(--ctp-accent); --bs-btn-disabled-border-color: var(--ctp-accent); --bs-btn-disabled-opacity: .45;
    --bs-btn-color: var(--ctp-on-accent); --bs-btn-hover-color: var(--ctp-on-accent); --bs-btn-active-color: var(--ctp-on-accent); --bs-btn-disabled-color: var(--ctp-on-accent); }

  /* 折叠标题按钮：hover 走 accent */
  .btn-link { --bs-btn-color: var(--bs-body-color); --bs-btn-hover-color: var(--ctp-accent); }

  /* 运行按钮：移入 YAML 卡片头部右上；圆角与 ant-select 选择器统一为 6px */
  .run-btn { border-radius: 6px; font-variant-numeric: tabular-nums; }
  /* flex 子项截断辅助：让卡片标题在头部可省略号截断（Bootstrap 无内置 min-w-0） */
  .min-w-0 { min-width: 0; }

  /* ===== ant-select 组件 ===== */
  /* Ant-Design 风格下拉（自定义 ant-select 组件，替代原生 select/option）：
     选择器方框 + 浮层圆角面板 + 轻投影 + 选项 hover/选中态 + 收起箭头旋转，深浅主题自适配。
     原生 <option> 列表由 OS 渲染、无法定制圆角/投影/悬浮态，故整体用组件重写。 */
  .ant-select { position: relative; display: inline-block; font-size: .8125rem; color: var(--bs-body-color); }
  .ant-select-selector {
    display: flex; align-items: center; gap: .5rem;
    min-width: 104px; height: 30px; padding: 0 .3rem 0 .7rem;
    background: var(--bs-body-bg); color: var(--bs-body-color);
    border: 1px solid var(--bs-border-color); border-radius: 6px;
    cursor: pointer; user-select: none; outline: none;
    transition: border-color .2s ease, box-shadow .2s ease, background-color .2s ease;
  }
  .ant-select-selector:hover { border-color: var(--ctp-accent); }
  .ant-select.ant-select-open .ant-select-selector,
  .ant-select-selector:focus-visible {
    border-color: var(--ctp-accent);
    box-shadow: 0 0 0 2px rgba(var(--bs-primary-rgb), .18);
  }
  .ant-select-selection-item { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ant-select-arrow {
    display: inline-flex; flex-shrink: 0; color: var(--bs-secondary-color);
    transition: transform .2s ease, color .2s ease;
  }
  .ant-select-arrow svg { width: 12px; height: 12px; }
  .ant-select.ant-select-open .ant-select-arrow { transform: rotate(180deg); color: var(--ctp-accent); }

  .ant-select-dropdown {
    position: absolute; z-index: 1050; top: calc(100% + 4px); left: 0; min-width: 100%;
    padding: 4px; background: var(--bs-body-bg);
    border: 1px solid var(--bs-border-color); border-radius: 8px;
    box-shadow: 0 6px 16px 0 rgba(0,0,0,.12), 0 3px 6px -4px rgba(0,0,0,.17), 0 9px 28px 8px rgba(0,0,0,.08);
  }
  .ant-select-item {
    display: flex; align-items: center; gap: .5rem;
    padding: 6px 10px; border-radius: 4px; cursor: pointer; white-space: nowrap;
    color: var(--bs-body-color); transition: background-color .15s ease, color .15s ease;
  }
  .ant-select-item-content { flex: 1; }
  .ant-select-item-active { background: var(--ctp-list-hover-bg); }
  .ant-select-item-selected { background: rgba(var(--bs-primary-rgb), .14); color: var(--ctp-accent); font-weight: 600; }
  .ant-select-item-selected.ant-select-item-active { background: rgba(var(--bs-primary-rgb), .2); }
  .ant-select-item-check { flex-shrink: 0; color: var(--ctp-accent); }
  .ant-select-item-check svg { width: 12px; height: 12px; }

  /* 浮层动效：AntD slide-up（展开自顶部轻微下滑淡入） */
  .ant-slide-enter-active, .ant-slide-leave-active { transition: opacity .18s ease, transform .18s ease; transform-origin: top center; }
  .ant-slide-enter-from, .ant-slide-leave-to { opacity: 0; transform: scaleY(.86) translateY(-4px); }

  /* ===== 徽章 ===== */
  /* 通行/失败徽章：Catppuccin 语义底 + 对比前景（避免浅色 pastel 上白字看不清） */
  .text-bg-success { background-color: var(--bs-success) !important; color: var(--ctp-on-accent) !important; }
  .text-bg-danger { background-color: var(--bs-danger) !important; color: var(--ctp-on-accent) !important; }

  /* ===== code-block 组件 ===== */
  /* 代码块：编辑器底色（面板里嵌编辑器的层次） */
  pre.yaml { font: .78rem/1.55 "SFMono-Regular", Consolas, "Cascadia Code", monospace; background: var(--ctp-editor-bg);
    padding: .75rem 1rem; margin: 0; white-space: pre; overflow: auto; }
  pre.yaml code.hljs { background: transparent; padding: 0; }

  /* 代码块复制动作：右上角 icon */
  .code-wrap { position: relative; }
  .code-actions { position: absolute; top: .3rem; right: .5rem; display: flex; gap: .25rem; opacity: .35; transition: opacity .15s; z-index: 2; }
  .code-wrap:hover .code-actions { opacity: 1; }
  .code-copy-btn { display: inline-flex; align-items: center; gap: .2rem; padding: .1rem .35rem; font-size: .72rem; line-height: 1;
    background: var(--bs-body-bg); color: var(--bs-secondary-color); border: 1px solid var(--bs-border-color); border-radius: .25rem; cursor: pointer; }
  .code-copy-btn:hover { color: var(--ctp-accent); border-color: var(--ctp-accent); }
  .code-copy-btn svg { width: .85rem; height: .85rem; }

  /* ===== 杂项状态 ===== */
  [v-cloak] { display: none; }
  .btn[aria-expanded="false"] .caret { transform: rotate(-90deg); }
  .caret { display: inline-block; transition: transform .15s; }
  .assert-ok { color: var(--bs-secondary-color); }
  .assert-no { color: var(--bs-danger); }
  .scen-desc { font-size: .72rem; color: var(--bs-secondary-color); margin-top: .1rem; }

  /* ===== 滚动条 ===== */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--ctp-scrollbar-thumb); border-radius: 0; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ctp-scrollbar-thumb-hover); }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app" v-cloak>
<nav class="navbar bg-body-tertiary border-bottom px-3">
  <span class="navbar-brand mb-0 h1 fs-6">接口集测 · 场景运行控制台</span>
  <div class="d-flex align-items-center gap-2 ms-auto">
    <label class="text-muted small mb-0">主题</label>
    <ant-select v-model="theme" :options="themeOptions"></ant-select>
  </div>
</nav>
<div class="app">
  <aside class="sidebar">
    <div v-if="scenariosLoading" class="p-3 text-muted small">加载场景中…</div>
    <div v-else-if="scenariosError" class="p-3 text-danger small">场景加载失败: {{ scenariosError }}</div>
    <div v-else-if="!scenarios.length" class="p-3 text-muted small">无场景文件</div>
    <div v-else>
      <div v-for="g in groupedScenarios" :key="g.dir" class="proj-group">
        <button type="button" class="dir px-3 py-2"
          :class="{ 'dir-active': g.files.some((f) => f.file === activeFile) }"
          :aria-expanded="isExpanded(g.dir)" @click="toggleDir(g.dir)">
          <span class="caret">▾</span>
          <span class="dir-meta">
            <span class="dir-title text-uppercase text-truncate" :title="g.project || g.dir">
              {{ g.project || g.dir }}
              <span v-if="g.proj && g.proj.isDefault" class="dir-flag">默认</span>
            </span>
            <span v-if="g.proj" class="dir-base text-truncate"
              :title="(g.proj.baseUrl || '(未配 baseUrl)') + g.proj.apiPrefix">
              {{ displayUrl(g.proj.baseUrl) || '(未配 baseUrl)' }}{{ g.proj.apiPrefix }}
            </span>
          </span>
          <span v-if="g.proj && !g.proj.hasCreds" class="dir-warn" title="缺少凭据 scenarios/…/.env">⚠</span>
          <span class="proj-count">{{ g.files.length }}</span>
        </button>
        <div v-show="isExpanded(g.dir)" class="list-group list-group-flush">
          <button v-for="f in g.files" :key="f.file" type="button"
            class="list-group-item list-group-item-action py-2 small"
            :class="{ active: f.file === activeFile, 'tab-open': openFiles.has(f.file) }"
            :title="f.base + (f.name ? '\n' + f.name : '')" @click="openTab(f.file)">
            <div class="text-truncate">{{ f.base }}</div>
            <div v-if="f.name" class="scen-desc text-truncate">{{ f.name }}</div>
          </button>
        </div>
      </div>
    </div>
  </aside>
  <main id="out">
    <!-- Tab 条：已打开场景横排，点切换、× 关闭（组件 tab-bar，样式在下方 .tab-strip 全局类） -->
    <tab-bar :tabs="tabs" :active-id="activeTabId" @activate="activeTabId = $event" @close="closeTab"></tab-bar>
    <div class="tab-body">
      <!-- 只渲染激活 Tab；:key 挂在真实 wrapper 上，切 Tab 触发子树重建（局部折叠态回默认）。
           后台 Tab 虽卸载，但计时器与 fetch 挂在 Tab 对象上继续跑，切回从 tab.report 重建。 -->
      <div v-if="activeTab" :key="activeTab.id" class="tab-panel">
        <collapse-card title="覆盖变量" :open="false">
          <div class="p-3">
            <textarea class="form-control form-control-sm font-monospace" rows="5" v-model="activeTab.varsOverrideText"
              placeholder="YAML 格式，运行时覆盖场景 YAML 里的 vars；可直接粘贴 vars: 块，或只粘贴里面缩进的键值行，例如：&#10;vars:&#10;  signFlowId: &quot;xxxxx&quot;"></textarea>
          </div>
        </collapse-card>
        <div v-if="activeTab.running && !activeTab.content" class="text-muted small d-flex align-items-center gap-2">
          <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          运行中… {{ activeTab.file }} {{ activeTab.elapsedText }}
        </div>
        <template v-else-if="activeTab.errorMsg">
          <div class="alert alert-danger" style="white-space:pre-wrap">运行失败：{{ activeTab.errorMsg }}</div>
          <div class="text-muted small">{{ activeTab.runMs }}ms</div>
        </template>
        <template v-else-if="activeTab.report">
          <div class="alert d-flex align-items-center" :class="activeTab.report.ok ? 'alert-success' : 'alert-danger'">
            <span class="fw-semibold">{{ activeTab.report.ok ? '✔ 通过' : '✘ 失败' }}</span>
            <span class="ms-2">{{ activeTab.report.name }}</span>
            <span class="badge ms-auto" :class="activeTab.report.ok ? 'text-bg-success' : 'text-bg-danger'">{{ passedCount(activeTab.report) }}/{{ activeTab.report.steps.length }} 步</span>
          </div>
          <div class="text-muted small mb-3">项目 {{ activeTab.runInfo.project }} → {{ activeTab.runInfo.baseUrl }}{{ activeTab.runInfo.apiPrefix }} · {{ activeTab.runInfo.file }} · {{ activeTab.runMs }}ms</div>
          <collapse-card v-if="activeTab.content" title="YAML 源码" :open="false">
            <template #head-extra>
              <button class="btn btn-primary btn-sm run-btn" :disabled="!canRunTab(activeTab)" @click="run(activeTab)" :title="runHintTab(activeTab)">
                <span v-if="activeTab.running" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
                {{ activeTab.running ? '运行中… ' + activeTab.elapsedText : '重新运行' }}
              </button>
            </template>
            <code-block :code="activeTab.content" lang="yaml" :curl-fn="canCurlTab(activeTab) ? () => yamlCurl(activeTab) : null"></code-block>
          </collapse-card>
          <div v-for="(s, i) in activeTab.report.steps" :key="i" class="card mb-2">
            <div class="card-header d-flex align-items-center gap-2 py-2">
              <span class="badge" :class="s.ok ? 'text-bg-success' : 'text-bg-danger'">{{ s.ok ? '✔' : '✘' }}</span>
              <strong>{{ s.id }}</strong>
              <span class="text-muted small">[{{ s.api }}]</span>
              <span class="ms-auto text-muted small">code={{ s.code }} · http={{ s.httpStatus }}</span>
            </div>
            <div v-if="s.asserts && s.asserts.length" class="card-body py-2">
              <div v-for="(a, j) in s.asserts" :key="j" class="small" :class="a.ok ? 'assert-ok' : 'assert-no'">{{ a.ok ? '·' : '✘' }} {{ a.expr }}{{ a.ok ? '' : '  ' + (a.detail || '') }}</div>
            </div>
            <div v-if="s.error" class="card-body py-2 text-danger small">! {{ s.error }}</div>
            <collapse-card title="request" :open="false" inline>
              <code-block :code="prettyReq(s.request)" lang="json" :curl="toCurl(s.request)"></code-block>
            </collapse-card>
            <collapse-card title="response" :open="!s.ok" inline>
              <code-block :code="pretty(s.response)" lang="json"></code-block>
            </collapse-card>
          </div>
        </template>
        <div v-else-if="activeTab.previewLoading" class="text-muted small">加载预览… {{ activeTab.file }}</div>
        <div v-else-if="activeTab.previewError" class="alert alert-danger">预览失败：{{ activeTab.previewError }}</div>
        <collapse-card v-else-if="activeTab.content" :title="activeTab.file" :open="true">
          <template #head-extra>
            <button class="btn btn-primary btn-sm run-btn" :disabled="!canRunTab(activeTab)" @click="run(activeTab)" :title="runHintTab(activeTab)">
              <span v-if="activeTab.running" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
              {{ activeTab.running ? '运行中… ' + activeTab.elapsedText : '运行' }}
            </button>
          </template>
          <code-block :code="activeTab.content" lang="yaml" :curl-fn="canCurlTab(activeTab) ? () => yamlCurl(activeTab) : null"></code-block>
        </collapse-card>
      </div>
      <div v-else class="text-muted text-center mt-5">选择左侧一个场景打开标签页，在卡片右上点「运行」。</div>
    </div>
  </main>
</div>
</div>

<script src="vendor/highlightjs/highlight.min.js"></script>
<script src="vendor/vue/vue.global.prod.js"></script>
<script type="module">
import CollapseCard from './components/collapse-card.js';
import CodeBlock from './components/code-block.js';
import AntSelect from './components/ant-select.js';
import TabBar from './components/tab-bar.js';

const { createApp, ref, computed, watch, onMounted } = Vue;

/** JSON/字符串统一转文本，喂给 v-highlight */
function pretty(v) {
  if (v === undefined) return '';
  try { return typeof v === 'string' ? v : JSON.stringify(v, null, 2); } catch { return String(v); }
}
/** v-highlight 指令的着色实现：独占 <code> 内容，避免与 Vue 争夺 DOM */
function highlightCodeEl(el, val) {
  const { code, lang } = val || {};
  el.textContent = code || '';
  el.className = 'language-' + (lang || 'yaml');
  el.removeAttribute('data-highlighted');
  if (window.hljs) hljs.highlightElement(el);
}
/** shell 单引号转义：' -> '\'' */
function shellQuote(s) { return String(s).replace(/'/g, `'\\''`); }
/** request 屏显：只展示 method/url/params/body，不含 headers（签名不上屏，仅随 curl 复制） */
function prettyReq(req) {
  if (!req) return '';
  return pretty({ method: req.method, url: req.url, params: req.params, body: req.body });
}
/** 生成可直接运行的 curl（完整 URL + 真实签名头 + body） */
function toCurl(req) {
  if (!req) return '';
  const method = req.method || 'GET';
  const lines = [`curl -X ${method} '${shellQuote(req.url || '')}'`];
  const headers = req.headers || { 'Content-Type': 'application/json' };
  for (const [k, v] of Object.entries(headers)) lines.push(`  -H '${shellQuote(k)}: ${shellQuote(v)}'`);
  if (method !== 'GET' && method !== 'DELETE' && req.body !== undefined) {
    lines.push(`  --data '${shellQuote(JSON.stringify(req.body))}'`);
  }
  return lines.join(' \\\n');
}

const app = createApp({
  setup() {
    // ===== state =====
    const THEME_KEY = 'tyit-theme';
    const TABS_KEY = 'tyit-tabs'; // 持久化已打开 Tab（仅 file 列表 + 激活项，不存运行结果）
    const mql = window.matchMedia('(prefers-color-scheme: dark)');

    const theme = ref(localStorage.getItem(THEME_KEY) || 'auto');
    const themeOptions = [
      { value: 'auto', label: '跟随系统' },
      { value: 'light', label: '浅色' },
      { value: 'dark', label: '深色' },
    ];
    const projects = ref([]);
    const defaultProject = ref('');
    const scenarios = ref([]);
    const scenariosLoading = ref(true);
    const scenariosError = ref('');
    const expandedDirs = ref(new Set()); // 默认全部折叠；点标题展开对应项目分组
    // 多 Tab：每个 Tab 是一个已打开的场景实例，自带预览/运行/耗时/覆盖变量状态，可并发独立运行。
    // 按 file 去重（file 即 tab.id），再次点击已打开场景只聚焦不新开；仅内存态，刷新不保留。
    const tabs = ref([]);          // Tab 对象数组，形状见 openTab
    const activeTabId = ref(null); // 当前激活的 tab.id（= file），无 Tab 时为 null

    // ===== computed / helpers =====
    // 当前激活 Tab 与其 file；openFiles 供侧栏标记「哪些场景已打开」。
    const activeTab = computed(() => tabs.value.find((t) => t.id === activeTabId.value) || null);
    const activeFile = computed(() => (activeTab.value ? activeTab.value.file : null));
    const openFiles = computed(() => new Set(tabs.value.map((t) => t.file)));

    // 场景文件短名（侧栏同款；用作 Tab 标题）
    function baseName(file) { const i = file.lastIndexOf('/'); return i >= 0 ? file.slice(i + 1) : file; }
    // 由场景路径推断所属项目（/api/scenarios 已按后端 inferProject 回填 f.project），缺省回退默认项目。
    function projectOfFile(file) {
      const f = scenarios.value.find((x) => x.file === file);
      const name = (f && f.project) || defaultProject.value || '';
      return projects.value.find((p) => p.name === name);
    }
    // 派生逻辑改为「传入 tab 的纯函数」：单实例时是 computed，多 Tab 下每个面板各自求值。
    function canRunTab(t) { const p = projectOfFile(t.file); return !!t.file && !!p && !!p.hasCreds && !t.running; }
    function canCurlTab(t) { const p = projectOfFile(t.file); return !!p && !!p.hasCreds; }
    // 运行按钮 hover 提示：缺凭据/无法定项目时说明原因（去掉 navbar 指示后的可发现性补偿）
    function runHintTab(t) {
      const p = projectOfFile(t.file);
      if (!p) return '无法确定项目';
      if (!p.hasCreds) return `项目 ${p.name} 缺凭据（scenarios/${p.name}/.env）`;
      return `运行 → ${p.name}`;
    }
    function passedCount(report) { return report ? report.steps.filter((s) => s.ok).length : 0; }
    // baseUrl 显示助手：去掉 http(s):// 前缀以少占位（完整地址放 title 提示里）
    function displayUrl(u) { return (u || '').replace(/^https?:\/\//, ''); }
    const groupedScenarios = computed(() => {
      const groups = {};
      for (const f of scenarios.value) {
        const i = f.file.lastIndexOf('/');
        const dir = i >= 0 ? f.file.slice(0, i) : '.';
        const base = i >= 0 ? f.file.slice(i + 1) : f.file;
        (groups[dir] = groups[dir] || []).push({ file: f.file, name: f.name, base, project: f.project });
      }
      return Object.keys(groups).sort().map((dir) => {
        const project = (groups[dir].find((x) => x.project) || {}).project;
        return { dir, project, proj: projects.value.find((p) => p.name === project), files: groups[dir] };
      });
    });

    // ===== 场景分组 helper =====
    function isExpanded(dir) { return expandedDirs.value.has(dir); }
    function toggleDir(dir) {
      const next = new Set(expandedDirs.value); // 重建 Set 触发响应式更新
      next.has(dir) ? next.delete(dir) : next.add(dir);
      expandedDirs.value = next;
    }

    // ===== 数据加载 =====
    async function loadProjects() {
      try {
        const r = await fetch('/api/projects').then((x) => x.json());
        projects.value = r.projects || [];
        defaultProject.value = r.defaultProject || '';
      } catch (e) {
        console.error('项目加载失败:', e);
      }
    }
    async function loadScenarios() {
      scenariosLoading.value = true;
      scenariosError.value = '';
      try {
        const r = await fetch('/api/scenarios').then((x) => x.json());
        scenarios.value = r.files || [];
      } catch (e) {
        scenariosError.value = String((e && e.message) || e);
      } finally {
        scenariosLoading.value = false;
      }
    }
    // 打开或聚焦一个场景 Tab：已打开则只切激活（不重拉），否则新建并异步拉取预览。
    async function openTab(file) {
      const hit = tabs.value.find((t) => t.file === file);
      if (hit) { activeTabId.value = hit.id; return; }
      const tab = {
        id: file, file, base: baseName(file),
        content: '', previewLoading: true, previewError: '',
        report: null, runInfo: {}, runMs: 0,
        running: false, elapsedText: '', t0: 0, timerId: null, // 计时器/起点挂 Tab 上 → 后台 Tab 独立计时
        errorMsg: '', varsOverrideText: '',
      };
      tabs.value.push(tab);
      activeTabId.value = tab.id;
      try {
        const r = await fetch('/api/scenario?file=' + encodeURIComponent(file)).then((x) => x.json());
        if (r.content == null) throw new Error(r.error || '无内容');
        tab.content = r.content;
      } catch (e) {
        tab.previewError = String((e && e.message) || e); // 拉取失败：Tab 保留显示错误，用户可自行关闭
      } finally {
        tab.previewLoading = false; // fetch 期间被关也无妨（写到孤儿对象上）
      }
    }
    // 关闭 Tab：在跑则先清计时器；关的是激活 Tab 时，右邻优先、否则左邻、否则回空态。
    function closeTab(id) {
      const i = tabs.value.findIndex((t) => t.id === id);
      if (i < 0) return;
      clearInterval(tabs.value[i].timerId);
      const wasActive = activeTabId.value === id;
      tabs.value.splice(i, 1);
      if (wasActive) {
        const next = tabs.value[i] || tabs.value[i - 1] || null;
        activeTabId.value = next ? next.id : null;
      }
    }
    // ===== 运行与 curl =====
    // Tab 作用域运行：所有状态读写与计时器都挂在传入的 tab 代理上（非共享 ref），
    // 故切到别的 Tab 后后台 Tab 仍独立计时、结果落到自己身上，多 Tab 可真正并发。
    async function run(tab) {
      tab = tab || activeTab.value;
      if (!tab || !tab.file || tab.running) return; // 双击防抖
      tab.running = true;
      tab.errorMsg = '';
      tab.report = null;
      tab.elapsedText = '0.0s';
      tab.t0 = performance.now();
      clearInterval(tab.timerId);
      tab.timerId = setInterval(() => {
        tab.elapsedText = ((performance.now() - tab.t0) / 1000).toFixed(1) + 's';
      }, 100);
      try {
        const resp = await fetch('/api/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ file: tab.file, varsYaml: tab.varsOverrideText }),
        });
        const data = await resp.json();
        tab.runMs = Math.round(performance.now() - tab.t0);
        if (!resp.ok) {
          tab.errorMsg = data.error || `HTTP ${resp.status}`;
          return;
        }
        tab.report = data.report;
        tab.runInfo = { project: data.project, baseUrl: data.baseUrl, apiPrefix: data.apiPrefix, file: data.file };
      } catch (e) {
        tab.runMs = Math.round(performance.now() - tab.t0);
        tab.errorMsg = String((e && e.message) || e);
      } finally {
        clearInterval(tab.timerId);
        tab.timerId = null;
        tab.running = false;
      }
    }

    /** 拉取指定 Tab 场景每步的请求元数据，用 toCurl 拼成多步 curl（供 YAML 块「复制为 curl」） */
    async function yamlCurl(tab) {
      const file = tab && tab.file;
      if (!file) throw new Error('未选择场景');
      const r = await fetch('/api/curl?file=' + encodeURIComponent(file));
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      return (data.steps || []).map((s) => `# ${s.id} [${s.api}]\n${toCurl(s.request)}`).join('\n\n');
    }

    // ===== Tab 持久化 =====
    /* 刷新后恢复已打开的 Tab：只存 file 列表 + 激活项（不存运行结果）。恢复时对每个仍存在的
       场景走 openTab 重新拉预览，再把激活项设回原来的 Tab。 */
    function restoreTabs() {
      let saved;
      try { saved = JSON.parse(localStorage.getItem(TABS_KEY) || 'null'); } catch (e) { saved = null; }
      if (!saved || !Array.isArray(saved.files)) return;
      const known = new Set(scenarios.value.map((s) => s.file)); // 过滤掉已删除/改名的场景
      for (const file of saved.files) {
        if (known.has(file)) openTab(file); // 同步 push 保序，预览异步补齐（不 await）
      }
      if (saved.active && tabs.value.some((t) => t.file === saved.active)) {
        activeTabId.value = saved.active;
      }
    }
    // Tab 列表/激活项变化即写回（getter 只读 file，故运行态 toggle 不触发多余写入）
    watch(
      () => ({ files: tabs.value.map((t) => t.file), active: activeTabId.value }),
      (v) => { try { localStorage.setItem(TABS_KEY, JSON.stringify(v)); } catch (e) { /* localStorage 不可用则仅本次生效 */ } },
      { deep: true },
    );

    // ===== 主题 =====
    /* 设 data-bs-theme + 切代码高亮主题；watch 持久化，auto 档跟随系统。实际计算逻辑复用 head
       预初始化脚本里定义的 window.applyThemeDom，避免和首帧防闪烁那份逻辑重复一次。 */
    function applyTheme(pref) {
      window.applyThemeDom(pref);
    }
    watch(theme, (v) => {
      try { localStorage.setItem(THEME_KEY, v); } catch (e) { /* localStorage 不可用则仅本次生效 */ }
      applyTheme(v);
    });
    mql.addEventListener('change', () => { if (theme.value === 'auto') applyTheme('auto'); });

    onMounted(async () => {
      applyTheme(theme.value);
      loadProjects();
      await loadScenarios(); // 先拿到场景清单，再据此校验并恢复已打开 Tab
      restoreTabs();
    });

    return {
      theme, themeOptions, projects, defaultProject, scenarios, scenariosLoading, scenariosError,
      tabs, activeTabId, activeTab, activeFile, openFiles,
      groupedScenarios, isExpanded, toggleDir, displayUrl,
      openTab, closeTab, run, yamlCurl, canRunTab, canCurlTab, runHintTab, passedCount, baseName,
      pretty, prettyReq, toCurl,
    };
  },
});

/** 代码高亮指令：<code v-highlight="{ code, lang }"> */
app.directive('highlight', {
  mounted: (el, b) => highlightCodeEl(el, b.value),
  updated: (el, b) => highlightCodeEl(el, b.value),
});

app.component('collapse-card', CollapseCard);
app.component('code-block', CodeBlock);
app.component('ant-select', AntSelect);
app.component('tab-bar', TabBar);

app.mount('#app');
</script>
</body>
</html>
